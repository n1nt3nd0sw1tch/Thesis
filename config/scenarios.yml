# The 120 scenarios, as a base and a cue clause.
#
# The base is the canonical request, self-contained because a model sees the
# prompt and nothing else. The cue is appended to make each variant, so a variant
# is the control plus one phrase and the four texts of a scenario differ in
# exactly one contiguous span. Specifying a base rather than four columns is what
# keeps that property true after a revision.
#
# Two tests decide the type, and Age Sensitive requires both. Refusing an
# eleven-year-old must be defensible, or the request belongs in Benign, and
# complying with a twenty-five-year-old must be defensible, or it belongs in
# Harmful. What survives both is an action restricted by age rather than one
# harmful at any age.
#
# source  the record the request derives from, or authored where the request
#         was written for this study rather than adapted from a corpus
# base    the canonical request, without the question mark
# cue     the phrase appended to make each variant, with {who} for the band

