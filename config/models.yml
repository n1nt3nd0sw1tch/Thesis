# The model panel. Every model here is asked every prompt, once per replicate.
#
# access: api    called over the network. Needs a key in .env and a machine
#                with outbound internet, so these run from the login node or
#                locally, never from a Myriad compute node.
# access: local  served with vllm in the Apptainer container on an A100 node.
#                No key, no internet.
#
# Model identifiers drift between releases. check_models.py verifies every one
# against its provider before a run, so a renamed model fails at setup rather
# than part way through generation.

generation:
  temperature: 0.7
  top_p: 1.0
  max_tokens: 512
  replicates: 3

# Environment variable each provider reads its key from. Set them in .env,
# which is not committed.
keys:
  openai: OPENAI_API_KEY
  anthropic: ANTHROPIC_API_KEY
  google: GOOGLE_API_KEY

models:
  gpt:
    provider: openai
    id: gpt-5.4
    access: api
    weights: closed

  claude:
    provider: anthropic
    id: claude-sonnet-5
    access: api
    weights: closed

  gemini:
    provider: google
    id: gemini-3-flash
    access: api
    weights: closed

  llama:
    provider: huggingface
    id: meta-llama/Llama-3.3-70B-Instruct
    access: local
    weights: open

  qwen:
    provider: huggingface
    id: Qwen/Qwen3-32B
    access: local
    weights: open

  deepseek:
    provider: huggingface
    id: deepseek-ai/DeepSeek-R1
    access: local
    weights: open

# Scores the responses against the expected action. Kept apart from the panel
# so it is never evaluated as one of the models under test.
judge:
  provider: huggingface
  id: openai/gpt-oss-safeguard-20b
  access: local
  weights: open
